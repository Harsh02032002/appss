name: Android APK Build (All 3 Apps)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Production Vercel Backend URL"
        required: false
        default: "https://dashbite-backend.vercel.app"

permissions:
  contents: write
  actions: read

env:
  EXPO_PUBLIC_BACKEND_URL: ${{ github.event.inputs.backend_url || vars.EXPO_PUBLIC_BACKEND_URL || 'https://dashbite-backend.vercel.app' }}
  EXPO_NO_TELEMETRY: "1"
  CI: "1"

jobs:
  build-apks:
    name: Build ${{ matrix.app_label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_label: "App 1 - DashBite Customer"
            app_dir: "frontend"
            artifact_name: "App-1-DashBite-Customer-APK"
            apk_filename: "DashBite-Customer.apk"
            application_id: "com.emergent.feastwave.xdh9pb"
          - app_label: "App 2 - DashBite Partner"
            app_dir: "restaurant-app"
            artifact_name: "App-2-DashBite-Partner-APK"
            apk_filename: "DashBite-Partner.apk"
            application_id: "com.emergent.feastwave.partner"
          - app_label: "App 3 - DashBite Rider"
            app_dir: "rider-app"
            artifact_name: "App-3-DashBite-Rider-APK"
            apk_filename: "DashBite-Rider.apk"
            application_id: "com.emergent.feastwave.rider"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "${{ matrix.app_dir }}/yarn.lock"

      - name: Configure Production Environment (.env)
        working-directory: ${{ matrix.app_dir }}
        run: |
          cat <<EOF > .env
          EXPO_PUBLIC_BACKEND_URL=${EXPO_PUBLIC_BACKEND_URL}
          EXPO_USE_FAST_RESOLVER="1"
          EOF
          echo "Configured production .env for ${{ matrix.app_dir }}:"
          cat .env

      - name: Install dependencies
        working-directory: ${{ matrix.app_dir }}
        run: |
          if [ -f "./scripts/cmd-guard.js" ]; then
            chmod +x ./scripts/cmd-guard.js || true
          fi
          yarn install --network-timeout 600000

      - name: Run Expo Prebuild (Generate Native Android Project)
        working-directory: ${{ matrix.app_dir }}
        run: |
          npx expo prebuild --platform android --no-install

      - name: Configure Gradle & Release Signing
        working-directory: ${{ matrix.app_dir }}/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat <<EOF >> gradle.properties

          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.daemon=false
          EOF

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "Using repository release signing keystore..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            cat <<EOF >> app/build.gradle

          android {
              signingConfigs {
                  customRelease {
                      storeFile file('release.keystore')
                      storePassword "${ANDROID_KEYSTORE_PASSWORD}"
                      keyAlias "${ANDROID_KEY_ALIAS}"
                      keyPassword "${KEY_PASS}"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.customRelease
                  }
              }
          }
          EOF
          else
            echo "Generating dedicated release keystore for installable production APK..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias dashbite_release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass dashbite2026 \
              -keypass dashbite2026 \
              -dname "CN=DashBite, OU=Mobile, O=DashBite, L=Bengaluru, S=KA, C=IN"
            cat <<EOF >> app/build.gradle

          android {
              signingConfigs {
                  customRelease {
                      storeFile file('release.keystore')
                      storePassword "dashbite2026"
                      keyAlias "dashbite_release"
                      keyPassword "dashbite2026"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.customRelease
                  }
              }
          }
          EOF
          fi

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Signed Release APK (${{ matrix.apk_filename }})
        working-directory: ${{ matrix.app_dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/${{ matrix.apk_filename }}"
          ls -lh "$GITHUB_WORKSPACE/dist/${{ matrix.apk_filename }}"

      - name: Upload Individual APK Artifact (${{ matrix.artifact_name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.apk_filename }}
          if-no-files-found: error
          retention-days: 90

  publish-apks:
    name: Publish All 3 APKs & Release
    needs: build-apks
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Verify All 3 APKs Present
        run: |
          ls -lh apks/
          test -f "apks/DashBite-Customer.apk"
          test -f "apks/DashBite-Partner.apk"
          test -f "apks/DashBite-Rider.apk"

      - name: Upload Combined APKs Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DashBite-All-3-APKs
          path: apks/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release with Direct APK Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apks
          name: "DashBite Android APKs (Customer, Partner, Rider)"
          body: |
            ### Automated Android Release APKs (Connected to Shared Vercel Backend)
            - **Shared Production Backend:** `${{ env.EXPO_PUBLIC_BACKEND_URL }}`
            - **App 1 (Customer App):** `DashBite-Customer.apk` (`com.emergent.feastwave.xdh9pb`)
            - **App 2 (Partner App):** `DashBite-Partner.apk` (`com.emergent.feastwave.partner`)
            - **App 3 (Rider App):** `DashBite-Rider.apk` (`com.emergent.feastwave.rider`)
          files: |
            apks/DashBite-Customer.apk
            apks/DashBite-Partner.apk
            apks/DashBite-Rider.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
